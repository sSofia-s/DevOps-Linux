<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Docker</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #342333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .box {
            background-color: #715E72;
            padding: 40px 60px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        h1 {
            margin: 0 0 10px 0;
            color: #fff;
        }

        h2 {
            margin: 0;
            color: #ddd;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Funcionando 100%!!</h1>
        <h2>Bem-vindo!</h2>
    </div>
</body>
</html>
